# ============================================
# electron-builder 配置 — Windows 安装包
# ============================================
appId: shsfdy2sq
productName: 二旦社区
copyright: Copyright © 2026 上中二旦

directories:
  output: release

files:
  - electron/**/*
  - out/**/*
  - '!**/node_modules/@next/**'

win:
  target:
    - target: portable
      arch:
        - x64
  icon: out/logo.png
  electronLanguages:
    - zh-CN
    - en-US

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 二旦社区
